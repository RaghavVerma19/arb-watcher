# Solana Triangular Arbitrage Scanner — market config.
# Amounts are in base units (token decimals, like "lamports" for SOL):
#   SOL  has 9 decimals  -> 1 SOL  = 1_000_000_000
#   USDC has 6 decimals  -> 1 USDC = 1_000_000
# fee_bps is the swap fee in basis points (1 bp = 0.01%). 30 = 0.3%.

[[tokens]]
symbol = "SOL"
decimals = 9
mint = "So11111111111111111111111111111111111111112"

[[tokens]]
symbol = "USDC"
decimals = 6
mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"

[[tokens]]
symbol = "USDT"
decimals = 6
mint = "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"

[[tokens]]
symbol = "JUP"
decimals = 6
mint = "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN"

[[tokens]]
symbol = "RAY"
decimals = 6
mint = "4k3Dyjzvzp8eMZWUXbBCjEvwSkkk59S5iCNLY3QrkX6R"

[[tokens]]
symbol = "BONK"
decimals = 5
mint = "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263"

[[tokens]]
symbol = "WIF"
decimals = 6
mint = "EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm"

# Pools are constant-product AMMs: reserve_a * reserve_b = k.
# Reserves are deliberately large (~$1M per side) relative to base_amount
# (10,000 USDC) so price impact is small, like real pools.
[[pools]]
token_a = "SOL"
token_b = "USDC"
reserve_a = 10_000_000_000_000 # 10,000 SOL
reserve_b = 1_000_000_000_000  # 1,000,000 USDC -> 1 SOL ~ 100 USDC
fee_bps = 30
dex = "raydium"
address = "58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2" # Raydium AMM v4 WSOL/USDC (onchain mode only)

[[pools]]
token_a = "USDC"
token_b = "USDT"
reserve_a = 1_000_000_000_000  # 1,000,000 USDC
reserve_b = 1_005_000_000_000  # 1,005,000 USDT -> 1 USDC buys ~1.005 USDT
fee_bps = 30
dex = "raydium"
address = "7TbGqz32RsuwXbXY7EyBCiAnMbJq1gm1wKmfjQjuwoyF" # Raydium AMM v4 USDT/USDC

[[pools]]
token_a = "USDT"
token_b = "SOL"
reserve_a = 980_000_000_000    # 980,000 USDT
reserve_b = 10_000_000_000_000 # 10,000 SOL    -> 1 SOL ~ 98 USDT
fee_bps = 30
dex = "raydium"
address = "7XawhbbxtsRcQA8KTkHT9f9nc6d69UwqCDh6U5EEbEmX" # Raydium AMM v4 WSOL/USDT

# Deliberate mispricing: pool 1 sells SOL at 100 USDC, but pool 3 sells it at
# 98 USDT (~97.5 USDC after pool 2's rate). So buy SOL with USDT (cheap),
# sell it for USDC (dear), then swap USDC back to USDT. Profit path:
#   USDC -> USDT -> SOL -> USDC

[[pools]]
token_a = "SOL"
token_b = "JUP"
reserve_a = 10_000_000_000_000 # 10,000 SOL
reserve_b = 600_000_000_000    # 600,000 JUP  -> 1 SOL ~ 60 JUP
fee_bps = 30
dex = "raydium"
address = "EYErUp5muPYEEkeaUCY22JibeZX7E9UuMcJFZkmNAN7c" # Raydium AMM v4 JUP/WSOL

[[pools]]
token_a = "JUP"
token_b = "USDC"
reserve_a = 600_000_000_000    # 600,000 JUP
reserve_b = 1_000_000_000_000  # 1,000,000 USDC -> 1 JUP ~ 1.666 USDC
fee_bps = 30
dex = "raydium"
address = "7RJ5qmsgmvUKK5QtCLT9qHpQMegkiULppHRBNuWso12E" # Raydium AMM v4 JUP/USDC

# These three are consistent (SOL -> JUP -> USDC implies 1 SOL = 100 USDC,
# matching pool 1), so they form NO arbitrage. Only the USDC/USDT/SOL cycle
# is mispriced.

[[pools]]
token_a = "RAY"
token_b = "SOL"
reserve_a = 300_000_000_000    # 300,000 RAY
reserve_b = 10_000_000_000_000 # 10,000 SOL   -> 1 RAY ~ 0.0333 SOL
fee_bps = 30
dex = "raydium"
address = "AVs9TA4nWDzfPJE9gGVNJMVhcQy3V9PGazuz33BfG2RA" # Raydium AMM v4 RAY/WSOL

