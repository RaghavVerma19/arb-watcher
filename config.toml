# Scanner parameters.
[scanner]
base_token = "USDC"          # start each cycle with this token
base_amount = 1_000_000_000  # 1,000 USDC (0.1% of pool depth -> small price impact)
min_profit_bps = 5           # only report cycles >= 0.05% net profit (lowered for mainnet)
max_cycle_len = 5            # N-leg cycles: 3 = triangles, 4 = quads, 5 = quints
report_min_gross_bps = 3     # report near-misses where gross (zero-fee) edge >= 0.03%

[simulator]
volatility = 0.002            # max per-tick price move (0.2%) for each token
pool_volatility = 0.008       # max per-tick move of each pool's own deviation (0.8%)
mean_reversion = 0.9          # how fast pools pull back toward token prices (0..1)
tick_interval_ms = 500        # time between market ticks
seed = 42                     # fixed seed for reproducible simulator runs

[jupiter]
base_url = "https://api.jup.ag"
refresh_ms = 2000             # delay between live quote scans

[onchain]
rpc_url = "https://api.mainnet-beta.solana.com"
refresh_ms = 2000             # minimum interval between scans (RPC rate floor)
slot_poll_ms = 250             # how often we poll getSlot for a new block
slot_polling = true            # scan on a new slot (chain-driven) instead of a blind timer

[paper]
enabled = true                # paper trading on/off
starting_capital = 10_000_000_000  # 10,000 USDC (6 decimals)
min_exec_bps = 50             # only trade cycles >= 0.50% net profit
live_exec = false             # KILL SWITCH: real trades are NEVER enabled

[server]
allowed_origin = "http://localhost:5173"
